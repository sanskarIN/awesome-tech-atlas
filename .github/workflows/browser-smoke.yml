name: Smoke test local browser explorer

on:
  pull_request:
    paths:
      - 'site/**'
      - 'data/resources.json'
      - 'resources/**'
      - 'scripts/browser_smoke.py'
      - 'tests/test_site.py'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    name: Local explorer ${{ matrix.browser }} smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: python -m pip install playwright==1.57.0
      - name: Install browser and runtime dependencies
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify explorer interactions
        run: python scripts/browser_smoke.py --browser ${{ matrix.browser }}
