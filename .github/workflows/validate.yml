name: Validate atlas content

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Catalog, Markdown, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog and local links
        run: python3 scripts/validate.py
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Set up Node.js for browser search tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser search and JavaScript syntax
        run: |
          node --check site/app.mjs
          python3 scripts/build_offline.py --output "$RUNNER_TEMP/atlas-offline.html"
          node --test tests/test_search.mjs tests/test_offline_script.mjs
